<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<input type="file" id="input">
<button id="button">点击</button>
<script src="../lib/baitu.min.js"></script>
<script>
    console.log(Baitu.ObjectUtil.isEmpty(["1"]))
    const button = document.querySelector("#button");

    function click(e) {
        console.log(e)
        console.log("1111")
    }
    button.addEventListener('click', Baitu.Debounce.with(click, 2000, false))


    const input = document.querySelector("#input");
    input.onchange = async () => {
        const file = input.files[0];
        if (file) {
            try {
                Baitu.FileUtil.isTypeMagic(file, "png").then(res => {
                    console.log(res)
                })
            } catch (error) {
                console.error('Error reading file:', error);
            }
        }
    };
</script>
</body>
</html>
