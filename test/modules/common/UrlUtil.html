<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UrlUtil</title>
</head>
<body>

<script src="https://unpkg.com/baitu/lib/baitu.min.js"></script>
<script>
    const {UrlUtil} = Baitu;
    console.log(UrlUtil.jsonToParams({
        params: '1',
        params2: '2',
        '232': '2314e3'
    }))

    console.log(UrlUtil.getParams())
    console.log(UrlUtil.getParam('_ijt'))
    console.log(UrlUtil.getDomain('https://doc.hutool.cn/pages/ChineseDate/#%E4%BD%BF%E7%94%A8'))
    console.log(UrlUtil.getDomain('aa://doc.hutool.cn/pages/ChineseDate/#%E4%BD%BF%E7%94%A8'))
    console.log(UrlUtil.getHash('https://doc.hutool.cn/pages/ChineseDate/#%E4%BD%BF%E7%94%A8'))

    console.log("fast-----------")
    console.log(UrlUtil.Fast)
    console.log(UrlUtil.Fast.getParams())
    console.log(UrlUtil.Fast.getParam("_ijt"))
</script>
</body>
</html>
