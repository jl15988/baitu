<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ObjectUtil</title>
</head>
<body>


<script src="../../../lib/baitu.min.js"></script>
<script>
    const {ObjectUtil} = Baitu;
    console.log(ObjectUtil.isEmpty())
    console.log(ObjectUtil.isEmpty(""))
    console.log(ObjectUtil.isEmpty([]))
    console.log(ObjectUtil.isEmpty({}))
    console.log(ObjectUtil.isEmpty(null))
    console.log(ObjectUtil.isEmpty(undefined))
    console.log(ObjectUtil.isEmpty("1"))
    console.log(ObjectUtil.isEmpty(["1"]))
    console.log(ObjectUtil.isEmpty({a: "2"}))
</script>
</body>
</html>
