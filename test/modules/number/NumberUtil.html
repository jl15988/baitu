<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NumberUtil</title>
</head>
<body>


<script src="../../../lib/baitu.min.js"></script>
<script>
    const {NumberUtil} = Baitu;

    console.log(NumberUtil.fixed(2.345))
    console.log(NumberUtil.fixed(2.344))
    console.log(NumberUtil.fixed(2.344534, 3))
    console.log(NumberUtil.fixedCut(2.344534, 3))
    console.log(NumberUtil.floor(2.344534))
    console.log(NumberUtil.ceil(2.344534))
    console.log(NumberUtil.bitwiseOr(1790194268845903872, 3).toString())
    // console.log(1790194268845903872 | 3)
    console.log(NumberUtil.toBinaryString("1790194268845904003"))
    console.log(NumberUtil.toBinaryString("1790194268845903875"))
    console.log(NumberUtil.toBinaryString("1790194268845903872"))
    console.log(NumberUtil.toBinaryString(3))
</script>
</body>
</html>
